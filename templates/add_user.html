<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User qo'shish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="/">Django Darslari</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-2">Bosh sahifa</a>
            <a href="/about/" class="btn btn-outline-light btn-sm">Haqida</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm p-4" style="max-width: 500px; margin: auto;">
            <h2 class="mb-4">Yangi user qo'shish</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Ism</label>
                    <input type="text" name="name" class="form-control" placeholder="Ismni kiriting">
                </div>
                <div class="mb-3">
                    <label class="form-label">Familiya</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Familiyani kiriting">
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefon</label>
                    <input type="text" name="phone_number" class="form-control" placeholder="+998901234567">
                </div>
                <button type="submit" class="btn btn-dark w-100">Saqlash</button>
            </form>
        </div>
    </div>

</body>
</html>
